# CI on self-hosted runners only, on the lead's own machines. Nothing runs on push: the lead starts a pipeline once per
# bundle (by hand or by the API), and a v* tag runs one. Every job runs the same gate, scripts/ci.mjs: the fast gate,
# or with RELEASE=1 (or on a tag) the release checks too. The runners take only protected refs. macOS is the lead's
# machine: `node scripts/ci.mjs` there, outside GitLab.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"

variables:
  TEST_FILTER: ""
  RELEASE: ""
  GIT_DEPTH: "20"

# The lead's Docker host (image: scripts/ci.Dockerfile). Privileged: the Linux PID-reuse test steers ns_last_pid.
linux:
  tags: [omni-linux]
  image: omni-ci-linux:1
  timeout: 45m
  variables:
    CARGO_TARGET_DIR: /ci-target
    # The runner shares the lead's machine: 2 cores (the container is limited to 2 CPUs and 4 GB).
    CARGO_BUILD_JOBS: "2"
  script:
    - node scripts/ci.mjs

# Runs once a Windows runner is registered and the project variable OMNI_WINDOWS is 1.
windows:
  tags: [omni-windows]
  timeout: 45m
  rules:
    - if: $OMNI_WINDOWS == "1"
  script:
    - node scripts/ci.mjs
