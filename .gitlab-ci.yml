# CI on self-hosted runners only (GitLab's free minutes ran out). Every job runs the same gate, scripts/ci.mjs: a push
# to main or bundle/* that changes code runs the fast gate on warm caches (minutes); a v* tag, or a pipeline started by
# hand or by the API with RELEASE=1, adds the release checks. The runners take only protected refs. macOS is the
# lead's machine: `node scripts/ci.mjs` there, outside GitLab.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
    - if: $CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^bundle\//)
      changes:
        - crates/**/*
        - bindings/**/*
        - conformance/**/*
        - scripts/**/*
        - Cargo.toml
        - Cargo.lock
        - rust-toolchain.toml
        - .gitlab-ci.yml

variables:
  TEST_FILTER: ""
  RELEASE: ""
  GIT_DEPTH: "20"

# The lead's Docker host (image: scripts/ci.Dockerfile). Privileged: the Linux PID-reuse test steers ns_last_pid.
linux:
  tags: [omni-linux]
  image: omni-ci-linux:1
  timeout: 30m
  variables:
    CARGO_TARGET_DIR: /ci-target
  script:
    - node scripts/ci.mjs

# Runs once a Windows runner is registered and the project variable OMNI_WINDOWS is 1.
windows:
  tags: [omni-windows]
  timeout: 30m
  rules:
    - if: $OMNI_WINDOWS == "1"
  script:
    - node scripts/ci.mjs
