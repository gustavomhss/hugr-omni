# Windows runtime on demand, for Windows-heavy work packages (W06, W12w):
#   gh workflow run windows.yml -f filter=<cargo test filter> [-f ref=wp/<id>]
name: windows
on:
  workflow_dispatch:
    inputs:
      filter:
        description: cargo test filter (empty = all)
        required: false
        default: ""
      ref:
        description: branch to test
        required: false
        default: ""

concurrency:
  group: windows-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - run: cargo test --workspace --no-fail-fast -- ${{ inputs.filter }}
        shell: bash
