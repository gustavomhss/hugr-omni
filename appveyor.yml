# CI on AppVeyor for the GitLab repo (GitLab's free minutes ran out on 2026-10-04). One job per OS, run in turn (the free
# plan has one concurrent job). Pushes to main and bundle/* build; wp/* never does. Any branch can be built on
# demand through the API, optionally with TEST_FILTER set (see AGENTS.md, "Gates").
version: '{build}'
skip_tags: true
clone_depth: 1

branches:
  only:
    - main
    - /^bundle\/.*/

image:
  - Ubuntu2404
  - macos-sonoma
  - Visual Studio 2022

environment:
  CARGO_TERM_COLOR: always
  TEST_FILTER: ""

matrix:
  fast_finish: false

build: off

for:
  # Linux: the static checks, the musl supervisor, the whole suite, the TS runner's teeth and K4.
  - matrix:
      only:
        - image: Ubuntu2404
    install:
      - sh: |
          set -euo pipefail
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc x86_64-unknown-linux-musl
    build_script:
      - sh: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          python3 scripts/file-size-guard.py && python3 scripts/test_file_size_guard.py
          python3 scripts/plan-sections-check.py
          # Parity, architecture and guarantees checks (W18), with their teeth.
          node --test scripts/surface-check/surface.test.mjs scripts/guarantees-check/check.test.mjs
          node scripts/surface-check/parity.mjs
          node scripts/surface-check/binding.mjs
          node scripts/guarantees-check/check.mjs
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          cargo build --release -p omni-supervisor --target x86_64-unknown-linux-musl
          readelf -l target/x86_64-unknown-linux-musl/release/hugr-omni-supervisor > elf.txt
          if grep -q INTERP elf.txt; then echo "the supervisor is dynamically linked"; exit 1; fi
          (cd bindings/node && npx -y -p typescript@5 tsc -p tsconfig.json && npx -y -p typescript@5 tsc -p test/tsconfig.json)
          cargo build --workspace --bins
          cargo build -p hugr-omni-node
    test_script:
      - sh: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # The PID-reuse test steers ns_last_pid in its own user namespace.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          HUGR_OMNI_SUPERVISOR="$PWD/target/x86_64-unknown-linux-musl/release/hugr-omni-supervisor" \
            cargo test -p omni-supervisor --no-fail-fast
          cargo test --workspace --no-fail-fast -- $TEST_FILTER
          node bindings/node/test/teeth.mjs
          # C-TS-01 / C-TS-02 through the binding: Node 22 and 24, Bun, Deno.
          for t in contract idioms; do node bindings/node/test/$t.mjs; done
          for t in contract idioms; do npx -y node@24 bindings/node/test/$t.mjs; done
          for t in contract idioms; do npx -y bun@1 bindings/node/test/$t.mjs; done
          for t in contract idioms; do npx -y deno@2 run -A bindings/node/test/$t.mjs; done
          # Every README and guide code block runs (C-DOC-01).
          node scripts/readme-check/check.mjs
          # K4 spawn round trip, release build (Linux is the K4 reference).
          cargo build --release --workspace --bins
          cargo test --release -p hugr-omni --no-fail-fast -- k4
          # K9: the shipped Linux package (zig, glibc 2.17 floor checked), installed clean with npm, bun and deno.
          pip install --user ziglang && cargo install --locked cargo-zigbuild
          cargo zigbuild --release -p hugr-omni-node --target x86_64-unknown-linux-gnu.2.17
          F=$(objdump -T target/x86_64-unknown-linux-gnu/release/libhugr_omni_node.so | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          [ "$F" = GLIBC_2.17 ] || { echo "the addon needs $F, above the 2.17 floor"; exit 1; }
          node bindings/node/npm/pack.mjs dist linux-x64-gnu
          for rt in node bun deno; do HUGR_BUN="npx -y bun@1" HUGR_DENO="npx -y deno@2" node bindings/node/npm/verify.mjs dist/tarballs $rt; done

  - matrix:
      only:
        - image: macos-sonoma
    install:
      - sh: |
          set -euo pipefail
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install
    build_script:
      - sh: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --workspace --bins
          cargo build -p hugr-omni-node
    test_script:
      - sh: |
          set -eo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --workspace --no-fail-fast -- $TEST_FILTER
          if [ -s "$HOME/.nvm/nvm.sh" ]; then source "$HOME/.nvm/nvm.sh"; nvm use 22 || nvm install 22; fi
          node --version
          for t in teeth contract idioms; do node bindings/node/test/$t.mjs; done
          node scripts/readme-check/check.mjs
          # K9 on this Mac's CPU.
          T=$(rustc -vV | sed -n 's/^host: //p'); case "$T" in aarch64*) ID=darwin-arm64;; *) ID=darwin-x64;; esac
          cargo build --release -p hugr-omni-node -p omni-supervisor --target "$T"
          node bindings/node/npm/pack.mjs dist "$ID"
          for rt in node bun deno; do HUGR_BUN="npx -y bun@1" HUGR_DENO="npx -y deno@2" node bindings/node/npm/verify.mjs dist/tarballs $rt; done

  # Windows Server 2019 (build 17763). Server 2022 runs on GitLab's Windows runner when it has minutes (.gitlab-ci.yml).
  - matrix:
      only:
        - image: Visual Studio 2022
    install:
      - ps: Install-Product node 22 x64
      - cmd: appveyor DownloadFile https://win.rustup.rs/x86_64 -FileName rustup-init.exe
      - cmd: rustup-init.exe -y --default-toolchain none --profile minimal
      - cmd: set PATH=%USERPROFILE%\.cargo\bin;%PATH%
      - cmd: rustup toolchain install
    build_script:
      - cmd: cargo build --workspace --bins
      - cmd: cargo build -p hugr-omni-node
    test_script:
      - cmd: cargo test --workspace --no-fail-fast -- %TEST_FILTER%
      - cmd: node bindings/node/test/teeth.mjs
      - cmd: node bindings/node/test/contract.mjs
      - cmd: node bindings/node/test/idioms.mjs
      - cmd: node scripts/readme-check/check.mjs
      - cmd: cargo build --release -p hugr-omni-node -p omni-supervisor --target x86_64-pc-windows-msvc
      - cmd: node bindings\node\npm\pack.mjs dist win32-x64-msvc
      - cmd: node bindings\node\npm\verify.mjs dist\tarballs node
      - cmd: set "HUGR_BUN=npx -y bun@1" && node bindings\node\npm\verify.mjs dist\tarballs bun
      - cmd: set "HUGR_DENO=npx -y deno@2" && node bindings\node\npm\verify.mjs dist\tarballs deno
